name: Keep Render Server Awake 24/7

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging Smart Hostel Backend on Render..."
          curl -sS --retry 3 --max-time 30 https://smart-hostel-system-zrci.onrender.com/api/health
          echo "Ping successful!"
